<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loop Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #e8ff47;
    --muted: #333;
    --text: #ccc;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    /* respect iOS safe areas */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ── TOP: speed controls ── */
  #controls {
    flex-shrink: 0;
    padding: 10px 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #speed-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #555;
    white-space: nowrap;
  }

  #speed-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
    white-space: nowrap;
  }

  #speed-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: var(--muted);
    outline: none;
    border-radius: 1px;
  }
  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #speed-slider::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }

  #loop-indicator {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--accent);
    opacity: 0.5;
    white-space: nowrap;
  }

  /* ── MIDDLE: video ── */
  #video-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  video::-webkit-media-controls            { display: none !important; }
  video::-webkit-media-controls-enclosure  { display: none !important; }
  video::-webkit-media-controls-panel      { display: none !important; }

  /* ── Placeholder ── */
  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    z-index: 5;
    touch-action: auto;
  }
  #placeholder.hidden { display: none; }

  #drop-icon { font-size: 48px; color: var(--muted); }
  #placeholder.drag-over #drop-icon { color: var(--accent); }

  #placeholder p {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #444;
    text-align: center;
    line-height: 1.8;
  }

  #file-btn {
    margin-top: 8px;
    padding: 12px 28px;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.2s, color 0.2s;
  }
  #file-btn:active { border-color: var(--accent); color: var(--accent); }
  #file-input { display: none; }

  /* ── Overlays ── */
  #status {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #555;
    letter-spacing: 0.08em;
    pointer-events: none;
    z-index: 6;
  }

  #pause-flash {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    transition: opacity 0.15s;
  }
  #pause-flash .icon {
    font-size: 72px;
    color: rgba(255,255,255,0.75);
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
  }

  #seek-feedback {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 8px 16px;
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.08em;
    pointer-events: none;
    opacity: 0;
    z-index: 7;
    transition: opacity 0.12s;
    white-space: nowrap;
  }

  /* ── BOTTOM: progress bar ── */
  #progress-bar {
    width: 100%;
    height: 3px;
    background: var(--muted);
    flex-shrink: 0;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    will-change: width;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOP: speed -->
  <div id="controls">
    <span id="speed-label">Vitesse</span>
    <input type="range" id="speed-slider" min="1" max="800" step="1" value="400">
    <span id="speed-value">1.00×</span>
    <span id="loop-indicator">∞</span>
  </div>

  <!-- MIDDLE: video -->
  <div id="video-wrapper">
    <div id="placeholder">
      <div id="drop-icon">⬇</div>
      <p>Glisser une vidéo ici<br>ou</p>
      <button id="file-btn">Choisir un fichier</button>
      <input type="file" id="file-input" accept="video/*">
    </div>

    <video id="vid" loop playsinline webkit-playsinline
      x-webkit-airplay="deny"
      disablepictureinpicture
      controlsList="nodownload nofullscreen noremoteplayback"
      style="-webkit-media-controls:none"></video>

    <div id="status"></div>
    <div id="pause-flash"><span class="icon">⏸</span></div>
    <div id="seek-feedback"></div>
  </div>

  <!-- BOTTOM: progress -->
  <div id="progress-bar"><div id="progress-fill"></div></div>

</div>
<script>
(function () {
  const vid         = document.getElementById('vid');
  const fill        = document.getElementById('progress-fill');
  const placeholder = document.getElementById('placeholder');
  const fileInput   = document.getElementById('file-input');
  const fileBtn     = document.getElementById('file-btn');
  const wrapper     = document.getElementById('video-wrapper');
  const slider      = document.getElementById('speed-slider');
  const speedDisp   = document.getElementById('speed-value');
  const pauseFlash  = document.getElementById('pause-flash');
  const seekFb      = document.getElementById('seek-feedback');
  const status      = document.getElementById('status');

  // ── Speed (log scale 0.01x → 8x) ─────────────────────────
  function sliderToSpeed(v) {
    const lo = Math.log(0.01), hi = Math.log(8);
    return Math.exp(lo + (v - 1) / 799 * (hi - lo));
  }
  function speedToSlider(s) {
    const lo = Math.log(0.01), hi = Math.log(8);
    return Math.round(1 + (Math.log(s) - lo) / (hi - lo) * 799);
  }
  slider.value = speedToSlider(1);
  speedDisp.textContent = '1.00×';
  slider.addEventListener('input', () => {
    const s = sliderToSpeed(+slider.value);
    speedDisp.textContent = s.toFixed(2) + '×';
    if (vid.readyState >= 1) vid.playbackRate = s;
  });

  // ── File loading ──────────────────────────────────────────
  fileBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  placeholder.addEventListener('dragenter', e => { e.preventDefault(); placeholder.classList.add('drag-over'); });
  placeholder.addEventListener('dragover',  e => e.preventDefault());
  placeholder.addEventListener('dragleave', () => placeholder.classList.remove('drag-over'));
  placeholder.addEventListener('drop', e => {
    e.preventDefault(); placeholder.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('video/')) loadFile(f);
  });
  wrapper.addEventListener('dragover', e => e.preventDefault());
  wrapper.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('video/')) loadFile(f);
  });

  function loadFile(file) {
    if (vid._objUrl) URL.revokeObjectURL(vid._objUrl);
    vid._objUrl = URL.createObjectURL(file);
    vid.src = vid._objUrl;
    vid.load();
    status.textContent = 'Chargement…';
  }

  vid.addEventListener('loadedmetadata', () => {
    vid.playbackRate = sliderToSpeed(+slider.value);
    placeholder.classList.add('hidden');
    status.textContent = '';
    const p = vid.play();
    if (p && p.catch) p.catch(() => { status.textContent = 'Appuyer pour lancer'; });
  });
  vid.addEventListener('error', () => {
    status.textContent = 'Format non supporté';
    placeholder.classList.remove('hidden');
  });

  // ── Progress ──────────────────────────────────────────────
  vid.addEventListener('timeupdate', () => {
    if (vid.duration) fill.style.width = (vid.currentTime / vid.duration * 100) + '%';
  });

  // ── Helpers ───────────────────────────────────────────────
  let flashT = null;
  function showFlash(paused) {
    pauseFlash.querySelector('.icon').textContent = paused ? '⏸' : '▶';
    pauseFlash.style.opacity = '1';
    clearTimeout(flashT);
    flashT = setTimeout(() => pauseFlash.style.opacity = '0', 600);
  }

  let seekT = null;
  function showSeek(delta, t) {
    const sign = delta >= 0 ? '+' : '−';
    seekFb.textContent = `${sign}${Math.abs(delta).toFixed(1)}s  •  ${fmt(t)}`;
    seekFb.style.left  = delta >= 0 ? '55%' : '5%';
    seekFb.style.opacity = '1';
    clearTimeout(seekT);
    seekT = setTimeout(() => seekFb.style.opacity = '0', 700);
  }

  function fmt(s) {
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }

  function togglePlay() {
    if (!vid.src) return;
    if (vid.paused) { vid.play().catch(()=>{}); showFlash(false); status.textContent = ''; }
    else            { vid.pause(); showFlash(true); }
  }

  // ── Touch gestures ────────────────────────────────────────
  const THRESHOLD = 6, SENS = 0.08;
  let tx0 = null, seeking = false;

  wrapper.addEventListener('touchstart', e => {
    if (!placeholder.classList.contains('hidden')) return;
    if (e.touches.length === 1) { tx0 = e.touches[0].clientX; seeking = false; }
  }, { passive: true });

  wrapper.addEventListener('touchmove', e => {
    if (tx0 === null || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - tx0;
    if (!seeking && Math.abs(dx) > THRESHOLD) seeking = true;
    if (seeking) {
      const delta = dx * SENS;
      const nt = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + delta));
      vid.currentTime = nt;
      tx0 = e.touches[0].clientX;
      showSeek(delta, nt);
    }
  }, { passive: true });

  wrapper.addEventListener('touchend', () => {
    if (!seeking && tx0 !== null) togglePlay();
    tx0 = null; seeking = false;
  }, { passive: true });

  // ── Mouse gestures ────────────────────────────────────────
  let mx0 = null, mSeeking = false;
  wrapper.addEventListener('mousedown', e => {
    if (!placeholder.classList.contains('hidden')) return;
    mx0 = e.clientX; mSeeking = false;
  });
  window.addEventListener('mousemove', e => {
    if (mx0 === null) return;
    const dx = e.clientX - mx0;
    if (!mSeeking && Math.abs(dx) > THRESHOLD) mSeeking = true;
    if (mSeeking) {
      const delta = dx * SENS;
      const nt = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + delta));
      vid.currentTime = nt;
      mx0 = e.clientX;
      showSeek(delta, nt);
    }
  });
  window.addEventListener('mouseup', () => {
    if (mx0 !== null && !mSeeking) togglePlay();
    mx0 = null; mSeeking = false;
  });

  wrapper.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
